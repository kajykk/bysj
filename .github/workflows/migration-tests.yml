name: migration-compat-tests

# STAB-P2-008: 数据库迁移向后兼容性 CI 测试
# 验证 alembic upgrade head → downgrade base → upgrade head 循环
# 防止 migration 文件的 downgrade() 函数缺失或不正确导致生产部署后无法回滚

on:
  push:
    branches: [main]
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/app/models/**'
      - 'backend/tests/test_stab_p2_008_migration_compat.py'
      - '.github/workflows/migration-tests.yml'
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/app/models/**'
      - 'backend/tests/test_stab_p2_008_migration_compat.py'
      - '.github/workflows/migration-tests.yml'

# SEC-FIX (P2): 最小权限声明
permissions:
  contents: read

jobs:
  migration-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migration compatibility test (STAB-P2-008)
        # 根 scripts/ 整体 gitignored (设计), CI 检出不包含 scripts/test_migration_compat.py.
        # 端到端 upgrade/downgrade/upgrade 循环由下方 pytest 承担 (SQLite 临时库, 无 PG 也跑).
        run: echo "standalone script not tracked; e2e covered by pytest step"

      - name: Run pytest migration structure tests (STAB-P2-008)
        working-directory: backend
        run: |
          # MAINT-P3-002: --maxfail=1 fail-fast
          python -m pytest tests/test_stab_p2_008_migration_compat.py --maxfail=1 -v --no-cov --tb=short
