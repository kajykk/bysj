name: PR Quality Gates

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# SEC-FIX (P2): 最小权限声明 (lint/测试/构建/覆盖率上传均只需读仓库内容)
permissions:
  contents: read

jobs:
  sklearn-compat-check:
    name: sklearn & Model Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sklearn compatibility check
        working-directory: backend
        run: |
          python scripts/check_compatibility.py --json
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  # MAINT-P3-003: Lint 门禁 (ruff blocking + bandit blocking + mypy/format non-blocking)
  lint:
    name: Lint (ruff + bandit + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # SEC-FIX (P2): ruff 钉版本与 .pre-commit-config.yaml (v0.6.9) 对齐,
          # 避免 CI 拉最新版本与本地 pre-commit 结果漂移
          pip install ruff==0.6.9 mypy>=1.9.0 bandit>=1.7.8
      - name: Ruff check (blocking)
        working-directory: backend
        run: ruff check app/
      - name: Ruff format check (non-blocking, tech debt)
        working-directory: backend
        continue-on-error: true
        run: ruff format --check app/
      - name: Bandit security scan (blocking on Medium+)
        working-directory: backend
        run: bandit -r app/ -c pyproject.toml -ll
      - name: Mypy type check (non-blocking, tech debt)
        working-directory: backend
        continue-on-error: true
        run: mypy app/ --no-error-summary

  # CI-AUDIT-04: 后端测试 job (unit/integration/contract/coverage) 已移除 —
  # coverage.yml (全量非 contract, 门禁 40%) 与 contract-tests.yml 均已双触发
  # (push+pull_request) 且经 Dependabot PR 实测通过, 此处重复运行是坏门禁:
  # 原 `-m "unit"`/`alembic upgrade head` 与实际仓库 (无 unit marker/
  # create_schema_ci.py) 不符, 恒失败。本 gate 只保留独立 workflow 未覆盖的:
  # sklearn 兼容 + lint + 前端构建/单测 + e2e smoke (mock API)。

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: npm audit (SEC-P3-003)
        working-directory: frontend
        # SEC-P3-003: 前端依赖安全审计, HIGH/CRITICAL 漏洞告警
        # 使用 continue-on-error 避免因 registry 问题或 dev 依赖漏洞阻塞 PR
        # 实际高危漏洞应通过 dependency-scan job (pip-audit/safety) 和 dependabot 处理
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
      - name: Build for production
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        # CI-AUDIT-04: 原 `npm run test:unit` 脚本不存在导致恒失败, 改为 vitest run
        run: npm run test

  e2e-smoke:
    name: E2E Smoke (Mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests (mock API)
        working-directory: frontend
        run: npx playwright test --project=chromium-smoke --reporter=list
        env:
          CI: true

  # SEC-A / SEC-B: 依赖 SCA (dependency-scan.yml) 与容器镜像扫描 (container-scan.yml)
  # 已由独立 workflow 承担 (正确的 paths: 条件触发 + 周度 schedule + workflow_dispatch).
  # CI-AUDIT-01: 此处重复的 dependency-scan / container-scan job 已删除 —
  # 原 if: contains(github.event.pull_request.files, ...) 在 pull_request 事件中恒为 false
  # (webhook payload 不含 files 字段), 导致扫描永不执行, 形成"假门禁".

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [sklearn-compat-check, lint, frontend-build, frontend-tests, e2e-smoke]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "## PR Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "- sklearn Compat: ${{ needs.sklearn-compat-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint (ruff+bandit+mypy): ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Smoke: ${{ needs.e2e-smoke.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend 测试/覆盖率/契约: 由 coverage.yml + contract-tests.yml 独立承担 (CI-AUDIT-04)" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency SCA + Container Scan: 由独立 workflow 承担 (见 dependency-scan.yml / container-scan.yml)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.sklearn-compat-check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "❌ Quality gates failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All quality gates passed" >> $GITHUB_STEP_SUMMARY
