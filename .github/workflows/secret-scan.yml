name: Secret Scan (gitleaks)

# SEC-FIX (P2): 密钥泄漏扫描接入 CI
# 背景: 2026-08 审核发现 contact-points.yaml 硬编码疑似真实 webhook token,
# 穿透了全部既有钩子 (无密钥扫描)。pre-commit 已加 gitleaks 钩子,
# 本 workflow 在服务端兜底——即使提交者绕过 pre-commit (--no-verify),
# PR 仍会被阻塞。
#
# 注意: gitleaks 只做增量检测 (默认 detect 模式扫 git 历史新增内容),
# 全量基线审查可用: gitleaks detect --log-opts=--all (CI 中先跑一次基线)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史用于增量扫描 (默认 shallow=1 会误判)
          fetch-depth: 0

      # SEC-FIX (P2): 钉到 commit SHA (v2 -> ff98106)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # action src/index.js:138 默认内置 8.24.3，不认识 .gitleaks.toml 的
          # [[allowlists]] / targetRules（8.25.0 起才有）。实测 8.24.3 加载本配置
          # 后仍报 47 leaks（allowlist 整体静默失效），故显式钉版本。
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # AUDIT-2026-10-07 (P0-4): 已入库内容的兜底扫描。
  # 实测 (探针 /tmp/pc_probe): gitleaks 增量模式只看**本次提交新增**的行 ——
  # 把已入库文件内容清空后再提交, 同一条规则即 "no leaks found"。
  # 即凭据一旦进入历史, 增量扫描永远看不见它; 本仓库 git 历史已出现过
  # 「凭据清除后又被写回」(fd6e9ab 引入 -> 6f1a651 restore)。
  # 该 job 扫全历史, 与上面的增量 job 互补。首次接入预计会报出历史存量,
  # 需配合 .gitleaks.toml allowlist 或历史清理后再设为 required。
  gitleaks-history:
    name: Gitleaks Full History Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # 存量基线未清前不阻塞, 先让结果可见
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全历史扫描必需
      - name: Run gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          # fetch-depth:0 已提供全历史, 无需 log-opts
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 与增量 job 保持同一版本、同一 allowlist，避免两处口径不一致。
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # 2026-11（阶段 0）: 工作区密钥扫描。
  # 补的是前两个 job 的盲区 —— gitleaks-action 只读 git（新增行 / 全历史），
  # 对「未被 git 追踪但存在于工作目录」的 .env、本地密钥副本完全不可见。
  # 本 job 同时校验：仓库内不得出现除 .env.example 之外的 env 文件。
  workspace-scan:
    name: Workspace Secret Scan (untracked included)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fail if repository contains env files (except .env.example)
        run: |
          set -eu
          offenders=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$offenders" ]; then
            echo "::error::仓库不应包含 env 文件，密钥必须放在仓库外并通过 ENV_FILE 注入:"
            echo "$offenders"
            exit 1
          fi
          if [ -f .env ] || [ -f backend/.env ]; then
            echo "::error::工作区发现 .env，禁止随目录流通"
            exit 1
          fi
          echo "OK: 仅保留 .env.example"

      - name: gitleaks dir scan (all files on disk, not only git)
        # gitleaks v8.19+ 的 `dir` 模式扫描文件系统而非 git 对象，
        # 因此能覆盖未追踪文件、构建产物与本地临时配置。
        run: |
          # 钉版本而非 latest：与两个 action job 共用 8.30.1 的 [[allowlists]] 语义。
          # 实测 8.30.1 会自动发现 /repo/.gitleaks.toml，这里仍显式 --config，
          # 把「扫描必须带 allowlist」写成 CI 里可见的事实，防止将来换镜像后静默失效。
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
