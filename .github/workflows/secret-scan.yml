name: Secret Scan (gitleaks)

# SEC-FIX (P2): 密钥泄漏扫描接入 CI
# 背景: 2026-08 审核发现 contact-points.yaml 硬编码疑似真实 webhook token,
# 穿透了全部既有钩子 (无密钥扫描)。pre-commit 已加 gitleaks 钩子,
# 本 workflow 在服务端兜底——即使提交者绕过 pre-commit (--no-verify),
# PR 仍会被阻塞。
#
# 注意: gitleaks 只做增量检测 (默认 detect 模式扫 git 历史新增内容),
# 全量基线审查可用: gitleaks detect --log-opts=--all (CI 中先跑一次基线)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # 需要完整历史用于增量扫描 (默认 shallow=1 会误判)
          fetch-depth: 0

      # SEC-FIX (P2): 钉到 commit SHA (v2 -> ff98106)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
