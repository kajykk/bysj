name: Container Image Security Scan

# SEC-B: 容器镜像 trivy 扫描
# - PR 修改 Dockerfile / docker-compose.yml 时触发
# - 每周日 03:00 UTC 全量扫描已发布镜像
# - HIGH/CRITICAL 漏洞阻塞合并 (exit-code: 1)
# - SARIF 报告上传到 GitHub Security tab
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'
      - 'backend/.trivyignore'
      - 'frontend/.trivyignore'
  schedule:
    # 每周日 03:00 UTC (北京时间 11:00) 全量扫描已发布镜像
    - cron: '0 3 * * 0'
  workflow_dispatch: # 支持手动触发

jobs:
  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # H-AUDIT-01: upload-sarif 需要 security-events write, 否则 "Resource not accessible by integration"
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        # SEC-FIX (P2): 钉到 commit SHA, 防可变 tag 被劫持 (v3 -> 8d2750c)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -f Dockerfile -t dws-backend:scan .

      - name: Run Trivy scan on backend image
        # H-AUDIT-01: 固定安全版本 v0.35.0 (2026-03 供应链攻击中唯一未被污染的版本),
        # 不再使用可变引用 @master; args 输入已移除, 改用类型化 inputs
        # SEC-FIX (P2): 钉到 commit SHA (v0.35.0 -> 57a97c7)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: dws-backend:scan
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # HIGH/CRITICAL 漏洞导致 CI 失败
          ignore-unfixed: true # 仅报告有修复版本的漏洞
          vuln-type: 'os,library' # 同时扫描 OS 包和语言依赖
          # T-P0-04: 仅扫描漏洞, 排除 secret/misconfig 扫描
          # 原因: app/core/deps.py 中 Grafana service_account JWT payload 会被
          # trivy secret scanner 误报为 GCP service-account key (false positive)
          # Secret 扫描应由独立的 git-secrets/gitleaks 工作流处理, 不在容器扫描范围
          scanners: 'vuln'
          trivyignores: 'backend/.trivyignore'

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        # SEC-FIX (P2): 钉到 commit SHA (v4 -> ff2f1c6)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-backend-results.sarif

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-backend-report
          path: trivy-backend-results.sarif
          retention-days: 30

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # H-AUDIT-01: upload-sarif 需要 security-events write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        # SEC-FIX (P2): 钉到 commit SHA (v3 -> 8d2750c)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile -t dws-frontend:scan .

      - name: Run Trivy scan on frontend image
        # H-AUDIT-01: 固定安全版本 v0.35.0, 类型化 inputs (与 backend 一致)
        # SEC-FIX (P2): 钉到 commit SHA (v0.35.0 -> 57a97c7)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: dws-frontend:scan
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          # T-P0-04: --scanners vuln 仅扫描漏洞 (与 backend 保持一致)
          scanners: 'vuln'
          trivyignores: 'frontend/.trivyignore'

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        # SEC-FIX (P2): 钉到 commit SHA (v4 -> ff2f1c6)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-frontend-results.sarif

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-frontend-report
          path: trivy-frontend-results.sarif
          retention-days: 30
