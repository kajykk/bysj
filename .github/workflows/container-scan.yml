name: Container Image Security Scan

# SEC-B: 容器镜像 trivy 扫描
# - PR 修改 Dockerfile / docker-compose.yml 时触发
# - 每周日 03:00 UTC 全量扫描已发布镜像
# - HIGH/CRITICAL 漏洞阻塞合并 (exit-code: 1)
# - SARIF 报告上传到 GitHub Security tab
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'
      - 'backend/.trivyignore'
      - 'frontend/.trivyignore'
  schedule:
    # 每周日 03:00 UTC (北京时间 11:00) 全量扫描已发布镜像
    - cron: '0 3 * * 0'
  workflow_dispatch: # 支持手动触发

jobs:
  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # H-AUDIT-01: upload-sarif 需要 security-events write, 否则 "Resource not accessible by integration"
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        # SEC-FIX (P2): 钉到 commit SHA, 防可变 tag 被劫持 (v3 -> 8d2750c)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -f Dockerfile -t dws-backend:scan .

      - name: Verify base-image hardening floor
        # 目的: 让 backend/.trivyignore 中的风险接受前提**可被 CI 自动验证**。
        # trivy 会在 pip 内嵌的 vendor.txt 里检出 msgpack 1.1.2 / setuptools 70.3.0,
        # 我们接受该检出, 依据是"镜像真实安装的版本高于公告阈值"。
        # 本步骤把这条依据固化成断言 —— 一旦真实安装包回退到阈值以下,
        # 说明忽略项的前提已失效, CI 立即失败并要求重新评估。
        run: |
          docker run --rm -i --entrypoint /usr/local/bin/python dws-backend:scan - <<'PY'
          import sys
          from importlib.metadata import PackageNotFoundError, version

          # 名称 -> (公告阈值, 对应 .trivyignore 条目)
          FLOORS = {
              "pip":         ((26, 2, 0), "CVE-2025-8869 等 pip 自身漏洞"),
              "setuptools":  ((83, 0, 0), "CVE-2025-47273 / CVE-2026-59890"),
              "msgpack":     ((1, 2, 1),  "GHSA-6v7p-g79w-8964"),
          }


          def vtuple(s):
              return tuple(int(x) for x in s.split(".")[:3] if x.isdigit())


          bad = []
          for name, (floor, why) in FLOORS.items():
              try:
                  cur_s = version(name)
              except PackageNotFoundError:
                  bad.append(f"{name}: NOT INSTALLED (need >= {'.'.join(map(str, floor))})")
                  continue
              cur = vtuple(cur_s)
              print(f"{name:11} installed={cur_s:10} floor={'.'.join(map(str, floor)):10} [{why}]")
              if cur < floor:
                  bad.append(f"{name}: {cur_s} < {'.'.join(map(str, floor))}")

          if bad:
              sys.exit(
                  "FAIL: 以下包低于 backend/.trivyignore 风险接受所假设的地板, "
                  "忽略项前提已失效, 请重新评估: " + "; ".join(bad)
              )
          print("OK: 所有受检包均高于 .trivyignore 风险接受所假设的地板")
          PY

      - name: Run Trivy scan on backend image
        # H-AUDIT-01: 固定安全版本 v0.35.0 (2026-03 供应链攻击中唯一未被污染的版本),
        # 不再使用可变引用 @master; args 输入已移除, 改用类型化 inputs
        # SEC-FIX (P2): 钉到 commit SHA (v0.35.0 -> 57a97c7)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dws-backend:scan
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # HIGH/CRITICAL 漏洞导致 CI 失败
          ignore-unfixed: true # 仅报告有修复版本的漏洞
          vuln-type: 'os,library' # 同时扫描 OS 包和语言依赖
          # T-P0-04: 仅扫描漏洞, 排除 secret/misconfig 扫描
          # 原因: app/core/deps.py 中 Grafana service_account JWT payload 会被
          # trivy secret scanner 误报为 GCP service-account key (false positive)
          # Secret 扫描应由独立的 git-secrets/gitleaks 工作流处理, 不在容器扫描范围
          scanners: 'vuln'
          trivyignores: 'backend/.trivyignore'

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        # SEC-FIX (P2): 钉到 commit SHA (v4 -> ff2f1c6)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-backend-results.sarif

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-report
          path: trivy-backend-results.sarif
          retention-days: 30

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # H-AUDIT-01: upload-sarif 需要 security-events write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        # SEC-FIX (P2): 钉到 commit SHA (v3 -> 8d2750c)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile -t dws-frontend:scan .

      - name: Run Trivy scan on frontend image
        # H-AUDIT-01: 固定安全版本 v0.35.0, 类型化 inputs (与 backend 一致)
        # SEC-FIX (P2): 钉到 commit SHA (v0.35.0 -> 57a97c7)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dws-frontend:scan
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          # T-P0-04: --scanners vuln 仅扫描漏洞 (与 backend 保持一致)
          scanners: 'vuln'
          trivyignores: 'frontend/.trivyignore'

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        # SEC-FIX (P2): 钉到 commit SHA (v4 -> ff2f1c6)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-frontend-results.sarif

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-frontend-report
          path: trivy-frontend-results.sarif
          retention-days: 30
