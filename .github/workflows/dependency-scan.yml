name: Dependency Security Scan

# SEC-A: 依赖项 SCA 扫描 (Software Composition Analysis)
# 双重扫描: pip-audit (PyPI 数据源) + safety (商业数据库兜底)
# 严重漏洞 (HIGH/CRITICAL) 阻塞 PR 合并
# 每周一 02:00 UTC (北京时间 10:00) 全量扫描

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - 'backend/requirements.lock'
      - '.github/workflows/dependency-scan.yml'
  schedule:
    # 每周一 02:00 UTC (北京时间 10:00) 全量扫描
    - cron: '0 2 * * 1'
  workflow_dispatch: # 支持手动触发

# SEC-FIX (P2): 最小权限声明
permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pip-audit
        run: python -m pip install --upgrade "pip-audit>=2.7.0"
      - name: Scan backend dependencies
        working-directory: backend
        run: |
          # --strict: 任何漏洞都返回非零退出码
          # --vulnerability-service: 使用 PyPI Advisory 数据库
          #
          # ── 已审阅的忽略项 (与 backend/.trivyignore 同一套风险接受纪律:
          #    必写原因, 每季度复审, 上游修复后立即移除) ─────────────────────
          # PYSEC-2026-3740  nltk 3.10.3 —— 上游无修复版本。
          #   证据: 该公告 fix_versions 为空, PyPI 上 nltk 最新即 3.10.3
          #   (2026-09-15 核实), 故不存在可升的修复版本。
          #   可达性: nltk 不是本项目依赖。它仅作为 safety 的运行时依赖被拖入
          #   (safety>=3.2.0 -> nltk>=3.9); safety 是开发期扫描工具, 不随镜像
          #   发布, 且 CI 的 safety 任务自行安装、并不安装 requirements-dev.txt。
          #   已核对 `app/` 与 `scripts/` 中零处 import nltk, 运行期无该代码路径。
          #   影响面: 公告涉及「以调用方可控路径加载模型产物」的 NLTK API,
          #   本服务不对外暴露此类入口。
          #   复审期限: 2026-12-15; nltk 发布修复版本后立即移除本行。
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-dev.txt \
            --format json \
            --output pip-audit-report.json \
            --ignore-vuln PYSEC-2026-3740 \
            --strict
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

  safety-scan:
    name: Safety Scan (Cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI-AUDIT-07 (2026-09-16): 本 job 此前是"假门禁", 有两处实测缺陷:
    #
    #  1) 扫描对象选错 —— 原来扫 requirements.txt (全为 >= 下限)。safety 2.x 只检查
    #     已钉死版本的条目, 于是 report_meta.packages_found = 0 —— 一个包都没扫,
    #     退出码 0, 门禁以绿灯形式"通过"。产物证据:
    #       2026-09-14T07:30Z (schedule, main) -> packages_found: 0, scanned: {}
    #       2026-09-15T06:42Z (dispatch, main) -> packages_found: 0, scanned: {}
    #     改扫 requirements.lock (钉死、且与镜像实际安装集合一致) 后同一命令
    #     得到 packages_found: 123。
    #  2) 退出码不可用作阻塞信号 —— 无 SAFETY_API_KEY 时走 2.x 免费档, 其
    #     fixed_versions 恒为空 (连 cryptography 46.0.3 这种 spec=<46.0.5、
    #     修复版本明确存在的条目也是空), 无法区分"可修"与"不可修"。
    #
    # 故: 扫描目标改为 lock, 判定交给 scripts/safety_report_gate.py ——
    #     分母为 0 一律失败 (消灭假绿灯); 有 key 时命中即失败 (保持原阻塞意图);
    #     无 key 时降级为咨询性告警, 但把逐条结论写进 job summary, 不再静默通过。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install safety
        env:
          # SEC-FIX (P2): secret 经 env 注入后判断, 不再直接内插进 bash 脚本
          # (值含引号/反引号时构成脚本注入面)
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          # 无 SAFETY_API_KEY secret 时安装 2.x (check 免登录, 公共漏洞库),
          # 避免 safety 3.x 在 CI 无 TTY 下强制注册提示导致 EOF 崩溃 (pyupio/safety#857)
          if [ -n "$SAFETY_API_KEY" ]; then
            python -m pip install --upgrade "safety>=3.2.0"
          else
            python -m pip install --upgrade "safety>=2.3.5,<3.0.0"
          fi
      - name: Scan with safety (pinned lock —— 部署实际安装的集合)
        working-directory: backend
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          # safety 3.x 命令格式: safety scan --file <requirements> (需 API key)
          # 无 key 时回退 2.x check: --json -o 输出 JSON 报告
          if [ -n "$SAFETY_API_KEY" ]; then
            safety scan \
              --file requirements.lock \
              --output json \
              --save-safety-report safety-report.json
          else
            # 免费档对命中的公告返回退出码 64。是否阻塞由下面的
            # safety_report_gate.py 统一判定 —— 免费档缺修复版本信息,
            # 退出码本身不是可靠信号, 故此处吞掉。
            safety check \
              -r requirements.lock \
              --output json \
              > safety-report.json || true
          fi
      - name: Assess safety report
        # 断言扫描分母非 0 (消灭假绿灯); 有 key 时命中即失败, 无 key 时仅告警。
        if: always()
        working-directory: backend
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          if [ -n "$SAFETY_API_KEY" ]; then
            python scripts/safety_report_gate.py safety-report.json --blocking
          else
            python scripts/safety_report_gate.py safety-report.json
          fi
      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safety-report
          path: backend/safety-report.json
          retention-days: 30
