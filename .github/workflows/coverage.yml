name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# SEC-FIX (P2): 双触发 (push+pull_request) 同 ref 跑两遍, concurrency 取消旧跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SEC-FIX (P2): 最小权限声明 (测试/上传类 workflow 只需读仓库内容)
permissions:
  contents: read

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Create database schema
        working-directory: backend
        run: python scripts/create_schema_ci.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
      - name: Run tests with coverage
        working-directory: backend
        # CI-AUDIT-02: 移除 continue-on-error: true — 测试失败必须真实阻塞 CI
        # (此前即使测试全挂 job 仍显示绿色, 形成假门禁). 失败时先输出摘要
        # 到 GITHUB_STEP_SUMMARY, 再以非零码退出; coverage 上传由 if: always() 步骤承担.
        run: |
          # --maxfail=0: 跑完全部测试收集完整覆盖率 (不中途停)
          # CI-AUDIT-03: 门禁对齐——本 job 跑全量测试 (除 contract), 是全仓基线门禁 (40%);
          # pr-quality-gates.yml 跑 unit+integration 子集, 门禁 50% (更快反馈)。
          # 渐进提升路线图: 40%(当前基线) → 50% → 60% → 70% → 85%
          pytest tests/ -m "not contract" \
            --maxfail=0 \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=40 \
            --tb=short \
            -q 2>&1 | tee /tmp/pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            {
              echo "## Backend tests had failures (blocking)"
              echo ""
              echo '```'
              tail -150 /tmp/pytest_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # CI-AUDIT-02: 真实失败必须让 job 变红, 不再吞掉退出码
            exit $exit_code
          fi
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage to Codecov
        # CI-AUDIT-02: always() 保证测试失败时仍上传已收集的 coverage.xml
        if: always()
        # SEC-FIX (P2): 钉到 commit SHA (v5 -> 0fb7174), 防可变 tag 被劫持
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage
        # MAINT-P3-002: 移除 continue-on-error: true, 测试失败必须阻塞 CI
        # MAINT-P3-001: 覆盖率门禁由 vitest.config.ts thresholds 控制 (50% 起点)
      - name: Upload coverage to Codecov
        # SEC-FIX (P2): 钉到 commit SHA (v5 -> 0fb7174)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  coverage-summary:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    if: always()
    steps:
      - name: Download backend coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: backend-coverage-report
          path: backend-coverage
      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage-report
          path: frontend-coverage
      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: see artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: see artifacts" >> $GITHUB_STEP_SUMMARY
