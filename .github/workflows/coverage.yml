name: Coverage

env:
  # GitHub Runner 自 2026-07 起默认 Node 24; actions/upload-artifact@v4 与
  # download-artifact@v4 仍捆绑 Node 20, 在 Node 24 上上传会"假成功"导致
  # 下游下载 artifact 报 "not found"。此变量恢复 Node 20 action 正常运行。
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Create database schema
        working-directory: backend
        run: python scripts/create_schema_ci.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
      - name: Run tests with coverage
        working-directory: backend
        # CI-AUDIT-02: 移除 continue-on-error: true — 测试失败必须真实阻塞 CI
        # (此前即使测试全挂 job 仍显示绿色, 形成假门禁). 失败时先输出摘要
        # 到 GITHUB_STEP_SUMMARY, 再以非零码退出; coverage 上传由 if: always() 步骤承担.
        run: |
          # --maxfail=0: 跑完全部测试收集完整覆盖率 (不中途停)
          # 覆盖率门禁渐进提升: 30%(当前基线) → 40% → 50% → 60% → 70% → 85%
          pytest tests/ -m "not contract" \
            --maxfail=0 \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=30 \
            --tb=short \
            -q 2>&1 | tee /tmp/pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            {
              echo "## Backend tests had failures (blocking)"
              echo ""
              echo '```'
              tail -150 /tmp/pytest_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # CI-AUDIT-02: 真实失败必须让 job 变红, 不再吞掉退出码
            exit $exit_code
          fi
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage to Codecov
        # CI-AUDIT-02: always() 保证测试失败时仍上传已收集的 coverage.xml
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage
        # MAINT-P3-002: 移除 continue-on-error: true, 测试失败必须阻塞 CI
        # MAINT-P3-001: 覆盖率门禁由 vitest.config.ts thresholds 控制 (50% 起点)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  coverage-summary:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    if: always()
    steps:
      - name: Download backend coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend-coverage
      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend-coverage
      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: see artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: see artifacts" >> $GITHUB_STEP_SUMMARY
