name: v1.39-alerting-e2e

env:
  # 恢复 bundles Node 20 的 actions/upload-artifact@v4 在 Node 24 runner 上的正常行为
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

# v1.39 Grafana Alerting E2E (TC-AT-012 / TC-AT-016 / TC-AT-017)
# Windows 本地不可达 (Docker Desktop + provisioning 加载限制), 转入 CI
# 来源: docs/planning/v1.39-grafana-alert-rules/NEXT_STEPS.md §2

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/grafana/**'
      - 'backend/app/services/observability_exporter.py'
      - 'backend/app/core/metrics.py'
      - 'docker-compose.yml'
      - '.github/workflows/v1.39-alerting-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/grafana/**'
      - 'backend/app/services/observability_exporter.py'
      - 'backend/app/core/metrics.py'
      - 'docker-compose.yml'
      - '.github/workflows/v1.39-alerting-e2e.yml'
  workflow_dispatch:

jobs:
  alerting-e2e:
    name: v1.39 Alerting E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 注入的占位 env var (prometheus/grafana 配置由模板生成, 见 Generate Prometheus 步骤)
      POSTGRES_PASSWORD: ci-postgres-pwd
      REDIS_PASSWORD: ci-redis-pwd
      JWT_SECRET_KEY: ci-jwt-secret-for-e2e-only
      GRAFANA_ADMIN_PASSWORD: ci-grafana-admin
      GRAFANA_SA_TOKEN: ci-grafana-sa-token
      GRAFANA_WEBHOOK_URL: https://example.invalid/ci-webhook
      GRAFANA_SRE_EMAIL: sre-ci@example.invalid
      GRAFANA_SLACK_URL: https://hooks.slack.com/services/CI/CI/CI
      GRAFANA_SLACK_CHANNEL: '#sre-alerts-ci'
      # docker-compose.yml 中 ${VAR:?...} 必需变量 (缺失会导致 docker compose up 插值失败)
      # H-AUDIT-01: 生产模式 Settings 硬性要求 PII_ENCRYPTION_KEY (>=32 字节且非弱密钥),
      # 缺失会导致 backend/alembic_migrate 容器启动即退出 -> compose up 失败
      PII_ENCRYPTION_KEY: Dzs6U9clCM8sqduuJLHmOi7vZpq6BvjHy9ZNU1-tsD4=
      ALERTMANAGER_WEBHOOK_SECRET: ci-alertmanager-secret
      METRICS_ACCESS_TOKEN: ci-metrics-token
      PASSWORD_RESET_BASE_URL: https://example.invalid/reset
      # Node 20 actions (upload-artifact@v4) 在 2026-06-16 后被强制 Node 24, 此开关保持兼容
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # H-AUDIT-01: prometheus.yml 含真实 token 不入库, 仓库仅存 .example 模板。
      # CI 中从模板生成并注入 CI token, 否则 (a) sed 找不到文件,
      # (b) grafana depends_on prometheus 会把缺失路径挂载成空目录导致 prometheus 起不来
      - name: Generate Prometheus config with CI token
        run: |
          cp infra/prometheus/prometheus.yml.example infra/prometheus/prometheus.yml
          sed -i "s|^    bearer_token: .*|    bearer_token: ${METRICS_ACCESS_TOKEN}|" infra/prometheus/prometheus.yml
          grep -n "bearer_token" infra/prometheus/prometheus.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML (TC-AT-001 ~ TC-AT-007)
        run: |
          python -c "import yaml; assert yaml.safe_load(open('infra/grafana/provisioning/alerting/rules.yaml'))['groups'][0]['rules'], 'rules empty'"
          python -c "import yaml; assert len(yaml.safe_load(open('infra/grafana/provisioning/alerting/contact-points.yaml'))['contactPoints'])>=2, 'cp <2'"
          python -c "import yaml; assert yaml.safe_load(open('infra/grafana/provisioning/alerting/policies.yaml'))['policies'][0].get('receiver'), 'no root policy receiver'"
          python -c "import yaml; assert len(yaml.safe_load(open('infra/grafana/provisioning/alerting/mute-timings.yaml'))['muteTimeIntervals'])==1, 'mute !=1'"
          python -c "import yaml; assert yaml.safe_load(open('infra/grafana/provisioning/datasources/prometheus.yaml'))['datasources'][0]['uid']=='PB0F7F7A2A1B0E0FA', 'uid mismatch'"
          echo "PASS: 5 YAML validate OK"

      - name: Start stack (postgres + redis + backend + grafana + prometheus)
        run: |
          docker compose up -d postgres redis
          sleep 10
          docker compose up -d backend grafana
          echo "Stack started, waiting for readiness..."

      - name: Wait for backend healthy (TC-AT-012 前置)
        run: |
          for i in $(seq 1 60); do
            if curl -s -f http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend not healthy within 60s"
          docker compose logs backend --tail 50
          exit 1

      - name: Wait for Grafana healthy
        run: |
          for i in $(seq 1 60); do
            if curl -s -f http://localhost:3000/api/health | grep -q '"ok"\|"database":"ok"'; then
              echo "Grafana healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Grafana not healthy within 60s"
          docker compose logs grafana --tail 50
          exit 1

      # ============================================================
      # TC-AT-012: 8 metric 在 /metrics 端点暴露
      # H-AUDIT-01: /api/v1/metrics 强制 Bearer 鉴权 (CRIT-007),
      # 原裸 curl 无 token 必 401, 本步骤从未通过
      # ============================================================
      - name: TC-AT-012 8 observability metrics exposed
        run: |
          CURL="curl -s -H \"Authorization: Bearer ${METRICS_ACCESS_TOKEN}\" http://localhost:8000/api/v1/metrics"
          METRICS=$($CURL | grep -c "^# HELP observability_")
          echo "Found $METRICS observability metrics"
          if [ "$METRICS" -lt 8 ]; then
            echo "::error::TC-AT-012 FAIL: expected ≥ 8 metrics, got $METRICS"
            $CURL | head -20
            exit 1
          fi
          for M in observability_channel_success_rate \
                   observability_am_sync_success_rate \
                   observability_lock_acquire_rate \
                   observability_lock_fallback_rate \
                   observability_lock_error_rate \
                   observability_lock_acquire_total \
                   observability_escalation_rate \
                   observability_alert_total; do
            if ! $CURL | grep -q "$M"; then
              echo "::error::TC-AT-012 FAIL: missing $M"
              exit 1
            fi
          done
          echo "PASS: TC-AT-012 8/8 metrics exposed"

      # ============================================================
      # TC-AT-016: Grafana provisioning 加载 10 条规则
      # ============================================================
      - name: TC-AT-016 10 alert rules loaded via provisioning
        run: |
          # 等待 provisioning 加载 (通常 5-10s)
          sleep 10
          RESP=$(curl -s -u admin:ci-grafana-admin \
            http://localhost:3000/api/v1/provisioning/alert-rules)
          # H-AUDIT-01: 该 API 返回扁平 rule 数组 (非 groups 结构), 原 g.get('rules') 恒为 0
          COUNT=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else sum(len(g.get('rules',[])) for g in d))")
          echo "Loaded $COUNT alert rules"
          if [ "$COUNT" -lt 9 ]; then
            echo "::error::TC-AT-016 FAIL: expected ≥ 9 rules, got $COUNT"
            echo "Response: $RESP"
            exit 1
          fi
          # 验证 group name
          if ! echo "$RESP" | grep -q "observability-alerts"; then
            echo "::error::TC-AT-016 FAIL: group 'observability-alerts' not found"
            exit 1
          fi
          echo "PASS: TC-AT-016 $COUNT rules loaded in 'observability-alerts' group"

      # ============================================================
      # TC-AT-017 (H-AUDIT-01, P0-2): 通知目的地不允许指向公网测试服务
      # 原断言 (GRAFANA_WEBHOOK_URL 为空时 contact point disabled) 已失效:
      # provisioning 文件使用字面量 URL (Grafana 11.5 不支持文件内 ${env:XXX}),
      # 故改为验证 sre-webhook 不泄漏到公网
      # ============================================================
      - name: TC-AT-017 no public webhook leakage
        run: |
          sleep 5
          RESP=$(curl -s -u admin:ci-grafana-admin \
            http://localhost:3000/api/v1/provisioning/contact-points)
          # H-AUDIT-01: provisioning API 返回扁平结构 (settings.url 在顶层, 无 receivers 数组)
          URL=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); cps=[c for c in d if c.get('name')=='sre-webhook']; print(cps[0]['settings'].get('url','') if cps else '')")
          echo "sre-webhook url=$URL"
          if [ -z "$URL" ] || echo "$URL" | grep -qE "httpbin|example\.com|webhook\.site|hooks\.slack\.com/services/CI"; then
            echo "::error::TC-AT-017 FAIL: sre-webhook 指向公网测试地址或缺失: '$URL'"
            exit 1
          fi
          echo "PASS: TC-AT-017 sre-webhook 不指向公网测试服务"

      - name: Upload logs on failure
        if: failure()
        run: |
          docker compose logs backend --tail 200 > backend.log 2>&1 || true
          docker compose logs grafana --tail 200 > grafana.log 2>&1 || true

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v139-alerting-e2e-logs
          path: |
            backend.log
            grafana.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: |
          docker compose down -v || true
