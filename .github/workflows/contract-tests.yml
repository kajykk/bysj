name: contract-tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# SEC-FIX (P2): 最小权限声明
permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Create database schema
        working-directory: backend
        run: python scripts/create_schema_ci.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
      - name: Export OpenAPI schema
        working-directory: backend
        run: python scripts/export_openapi.py
      - name: Run contract tests
        working-directory: backend
        # CI-AUDIT-08: 移除 continue-on-error——与 pr-quality-gates.yml 中的
        # 契约测试门禁语义统一 (阻塞)。schemathesis 环境依赖问题已稳定,
        # 失败必须真实红掉 job, 不再吞退出码。
        run: |
          # -o addopts=: 跳过 pytest.ini 的 --cov (契约测试不需要 coverage)
          pytest tests/contract/ --maxfail=0 -o "addopts=" -v --tb=short 2>&1 | tee /tmp/contract_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            {
              echo "## Contract tests had failures (blocking)"
              echo ""
              echo '```'
              tail -150 /tmp/contract_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit $exit_code
          fi
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/testdb
      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: contract-test-results
          path: backend/tests/contract/
