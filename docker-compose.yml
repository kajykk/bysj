# Docker Compose for Depression Warning System v1.39
# Architecture: 8 services (postgres + redis + alembic_migrate + backend + celery_worker + celery_beat + frontend + grafana + prometheus)
# Usage: docker compose up -d
# Docs: docs/DEPLOYMENT_GUIDE.md

name: dws

services:
  # ── 数据库 ──────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: dws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: depression_system
      POSTGRES_USER: depress_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depress_admin -d depression_system"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis (Celery broker + cache + pubsub) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: dws-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dws-net

  # ── 数据库迁移 (one-shot) ──────────────────────────────────
  alembic_migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dws-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://depress_admin:${POSTGRES_PASSWORD}@postgres:5432/depression_system
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      # SEC-P1-002: Settings() 校验需要 (即使迁移不发送邮件, Settings() 仍会验证)
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must start with https:// in production}
      # P1-INFRA-003/004: 生产环境必填密钥
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:?ALERTMANAGER_WEBHOOK_SECRET is required}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?METRICS_ACCESS_TOKEN is required}
    command: ["python", "scripts/init_db.py"]
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ./backend/alembic:/app/alembic:ro
      - ./common:/common:ro
      - ./backend/app:/app/app:ro
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── 后端 API (FastAPI uvicorn) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dws-backend:v1.41
    container_name: dws-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic_migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_NAME: "Depression Warning System"
      DATABASE_URL: postgresql+asyncpg://depress_admin:${POSTGRES_PASSWORD}@postgres:5432/depression_system
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: 30
      # SEC-P1-002: 生产环境必须 https://
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must start with https:// in production}
      # P1-INFRA-003/004: 生产环境必填密钥
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:?ALERTMANAGER_WEBHOOK_SECRET is required}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?METRICS_ACCESS_TOKEN is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_PREVIOUS_KEYS: ${PII_PREVIOUS_KEYS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      MODEL_DIR: /app/models
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      GRAFANA_SERVICE_TOKEN: ${GRAFANA_SERVICE_TOKEN:-}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      ENABLE_SEED: "false"
      # S-02: 切换默认结构化模型为 v1.23 (真实数据训练, F1=0.8955 vs v1.20 F1=0.8657)
      STRUCTURED_DEFAULT_MODEL: v1.23
    ports:
      - "8001:8000"
    volumes:
      - ./backend/models:/app/models:ro
      - ./common:/common:ro
      - ./backend/app:/app/app:ro
      - backend_logs:/app/logs
      - backend_tmp:/app/tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ── Celery Worker (异步任务) ───────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dws-backend:v1.41
    container_name: dws-celery-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://depress_admin:${POSTGRES_PASSWORD}@postgres:5432/depression_system
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      MODEL_DIR: /app/models
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      # SEC-P1-002: Settings() 校验需要
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must start with https:// in production}
      # P1-INFRA-003/004: 生产环境必填密钥
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:?ALERTMANAGER_WEBHOOK_SECRET is required}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?METRICS_ACCESS_TOKEN is required}
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=100
    volumes:
      - ./backend/models:/app/models:ro
      - ./common:/common:ro
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Celery Beat (定时任务调度) ─────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dws-backend:v1.41
    container_name: dws-celery-beat
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://depress_admin:${POSTGRES_PASSWORD}@postgres:5432/depression_system
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      MODEL_DIR: /app/models
      # SEC-P1-002: Settings() 校验需要
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must start with https:// in production}
      # P1-INFRA-003/004: 生产环境必填密钥
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:?ALERTMANAGER_WEBHOOK_SECRET is required}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?METRICS_ACCESS_TOKEN is required}
    command: >
      celery -A app.core.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend/models:/app/models:ro
      - ./common:/common:ro
      - ./backend/app:/app/app:ro
    healthcheck:
      # celery-beat 无 HTTP 服务，不能用 curl /health 检查
      # 改用进程检查：确认 celery beat 进程在运行
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── 前端 (nginx + Vue SPA + TLS 终结) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dws-frontend:scan-p0-04-v4
    container_name: dws-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # T-P0-04: 改用进程检查 (Docker 健康检查环境中 wget localhost 解析为 IPv6, nginx 只监听 IPv4)
      # 功能验证通过外部 HTTPS 访问完成, 健康检查仅需确认 nginx 进程存活
      test: ["CMD-SHELL", "pgrep nginx >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Prometheus (抓取 backend /api/v1/metrics, 供 Grafana Alert Rules) ──
  # H-AUDIT-01: v1.39 告警链路依赖真实 Prometheus, 此前 datasource 误指向
  # backend:8000 (backend 非 Prometheus 协议) 导致持续 405 与规则评估失败.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dws-prometheus
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Grafana (仪表盘 + 告警) ────────────────────────────────
  # T-P0-04: 11.6.0 在 Docker Desktop on Windows 上二进制为 0 字节 (exec format error),
  # 降级至 11.5.0 (项目记忆已验证可用). 待 11.6.x 修复后可再升级.
  grafana:
    image: grafana/grafana:11.5.0
    container_name: dws-grafana
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # H-AUDIT-01: datasources provisioning 需要的 token
      # (prometheus.yaml -> ${METRICS_ACCESS_TOKEN}, observability-api.yaml -> ${GRAFANA_SA_TOKEN})
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?METRICS_ACCESS_TOKEN is required}
      GRAFANA_SA_TOKEN: ${GRAFANA_SA_TOKEN:?GRAFANA_SA_TOKEN is required}
      # H-AUDIT-01: simpod-json-datasource 插件必须在容器启动前安装
      GF_PLUGINS_PREINSTALL: grafana-simple-json-datasource
      # contact-points.yaml 需要这些 env vars (Grafana 11.5 占位符 ${env:XXX})
      GRAFANA_WEBHOOK_URL: ${GRAFANA_WEBHOOK_URL:-}
      GRAFANA_SRE_EMAIL: ${GRAFANA_SRE_EMAIL:-}
      GRAFANA_SLACK_URL: ${GRAFANA_SLACK_URL:-}
      GRAFANA_SLACK_CHANNEL: ${GRAFANA_SLACK_CHANNEL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # H-AUDIT-01: 仪表盘 provider 加载路径 (alerts-overview.yaml 指向此目录)
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - dws-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  dws-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_tmp:
  grafana_data:
