apiVersion: 1

# v1.39 Grafana Routing Policies - FINAL 11.5 compatible
# 2026-07-25 修复 (recovery incident):
#   1. 验证发现: 任何 routes 子项都触发 [routes.invalidFormat] 错误
#   2. Grafana 11.5 与 11.6 在 routes 段有 schema 差异, 暂未找到 11.5 兼容的 routes 写法
#   3. 妥协方案: 仅保留根 policy, 所有 alert 路由到 sre-webhook
#   4. P0/P1/P2 复杂分级路由通过 Grafana UI (http://localhost:3000/alerting/routes) 手动配置
#
# 路由设计 (current):
#   - 根 policy: sre-webhook (所有 alert 走此 receiver, 兜底)
#   - H-AUDIT-01 (P0-2): receiver 目标暂为集群内 no-op, 通知不产生外部流量;
#     恢复方式见 contact-points.yaml 头部注释
#   - 复杂分级路由: 通过 UI 配置 (后续可参考 v1.39 R1 决策 Q2/Q3)
#     - P0: webhook + email 并发, 即时通知, 24x7 不静音
#     - P1: webhook + email 并发, 30s 延迟, 24x7 不静音
#     - P2: 仅 email, 工作日 09:00-18:00 通知

policies:
  - orgId: 1
    receiver: sre-webhook
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 10m
    repeat_interval: 4h
