apiVersion: 1

# v1.39 Grafana Contact Points
# 3 个通知渠道:
#   - sre-webhook (P0/P1 即时通道, R1 决策 Q2: 优先)
#   - sre-email (P0/P1 存档通道)
#   - slack-alerts (P0/P1 协同通道, 未配置时注释)
#
# 2026-07-25 修复: Grafana 11.5 provisioning 文件不支持 ${env:XXX} 占位符
# (Grafana 内部系统变量只能通过 GF_ 前缀环境变量注入, 不能用于 url/email)
#
# H-AUDIT-01 修复 (2026-08-13): 告警不再静默丢弃。
#   1. sre-webhook 目标改为 backend 的告警接入端点 POST /api/v1/alerts/webhook,
#      该端点校验 ALERTMANAGER_WEBHOOK_SECRET 后进入系统自身告警管线
#      (去重/静默/持久化审计/CompositeNotifier 通知)。
#   2. 本文件中的 __WEBHOOK_URL__ / __WEBHOOK_SECRET__ / __SRE_EMAIL__ 占位符
#      由容器启动脚本 infra/grafana/init-alerting.sh 在启动时用环境变量
#      (ALERT_WEBHOOK_URL / ALERTMANAGER_WEBHOOK_SECRET / GRAFANA_SRE_EMAIL) 渲染替换,
#      密钥不进 git、不出现在镜像层。
#   3. 收到真实运维通知地址后, 配置 CompositeNotifier 通道 (webhook/slack/
#      dingtalk/email 环境变量) 即可获得系统外的最终投递。
contactPoints:
  - orgId: 1
    name: sre-webhook
    receivers:
      - uid: cp-webhook
        type: webhook
        settings:
          url: __WEBHOOK_URL__
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: __WEBHOOK_SECRET__
        disableResolveMessage: false
  - orgId: 1
    name: sre-email
    receivers:
      - uid: cp-email
        type: email
        settings:
          addresses: __SRE_EMAIL__
          singleEmail: false
        disableResolveMessage: false
  # slack-alerts 已禁用: GRAFANA_SLACK_URL 在 .env 中为空,无效 URL 会导致 provisioning 失败
  # - orgId: 1
